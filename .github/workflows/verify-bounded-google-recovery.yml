name: Verify bounded Google recovery and checkpoint regression tests
on:
  push:
    branches: [ontario-401-fsa-live-ranking-20261121]
    paths:
      - '.github/workflows/verify-bounded-google-recovery.yml'
      - 'research/recover_google_tiles.py'
      - 'research/test_google_bounded_recovery.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies without launching browser
        run: python -m pip install -r requirements.txt
      - name: Compile and test finite queue, legacy checkpoint, and source failure paths
        run: |
          python -m compileall -q finder/google_browser.py research/recover_google_tiles.py
          python -m unittest research.test_google_bounded_recovery -v
      - name: Verify rank-bound screening on the actual Ontario 498-area audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p first-pass
          gh run download 44952655975 -n full-ontario-498-google-census-audit -D first-pass
          python - <<'PY'
          import csv
          from research.recover_google_tiles import priority_unresolved_fsas
          with open('first-pass/google_all_ontario_498.csv', newline='') as f:
              rows=list(csv.DictReader(f))
          priority, dominated, cutoff=priority_unresolved_fsas(rows)
          print('ONTARIO_PRIORITY_TEST', dict(total=len(rows),priority=len(priority),
                dominated=len(dominated),cutoff=cutoff))
          assert len(rows)==498
          assert priority and dominated, (len(priority),len(dominated),cutoff)
          assert len(priority | dominated)==len(priority)+len(dominated)
          assert len(priority | dominated) <= 241
          assert cutoff > 0, cutoff
          PY
      - name: Test final ranking evidence gate against 498 real areas
        run: |
          mkdir -p empty-recovery bounded-ranking-audit
          set +e
          python -m research.finalize_full_google_498 first-pass/google_all_ontario_498.csv empty-recovery bounded-ranking-audit
          outcome=$?
          set -e
          test "$outcome" -eq 1
          python - <<'PY'
          import csv, json
          from pathlib import Path
          root=Path('bounded-ranking-audit')
          report=json.loads((root/'google_498_recovery_report.json').read_text())
          assert report['total_ontario_fsa']==498, report
          # The 257 old "completed" Google keyword pages had no
          # individually verified clinical businesses. With zero item-level
          # sources all 498 ARE incomplete (not just the original 241).
          assert report['other_incomplete_google_sources']==498, report
          assert report['clinically_completed_eligible_fsa']==0, report
          assert report['potential_top_60_contenders_unresolved']==490, report
          assert report['dominated_incomplete_sources']==0, report
          assert not report['google_60_certified_within_source_observation_model'], report
          assert not (root/'Ontario_Google_Top60_Completed_Feeds_Provisional.csv').exists()
          assert len(list(csv.DictReader((root/'Ontario_Google_Clinically_Completed_Source_Subset.csv').open())))==0
          assert len(list(csv.DictReader((root/'ontario_498_google_recovery_audit.csv').open())))==498
          assert not (root/'Ontario_Google_Best_60_Across_498.csv').exists()
          print('FINALIZER_RANK_BOUNDS_TEST_PASSED', json.dumps(report))
          PY
