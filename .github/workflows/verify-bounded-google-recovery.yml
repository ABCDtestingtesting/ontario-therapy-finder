name: Verify bounded Google recovery and checkpoint regression tests
on:
  push:
    branches: [ontario-401-fsa-live-ranking-20261121]
    paths:
      - '.github/workflows/verify-bounded-google-recovery.yml'
      - 'research/recover_google_tiles.py'
      - 'research/test_google_bounded_recovery.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies without launching browser
        run: python -m pip install -r requirements.txt
      - name: Compile and test finite queue, legacy checkpoint, and source failure paths
        run: |
          python -m compileall -q finder/google_browser.py research/recover_google_tiles.py
          python -m unittest research.test_google_bounded_recovery -v
      - name: Verify rank-bound screening on the actual Ontario 498-area audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p first-pass
          gh run download 44952655975 -n full-ontario-498-google-census-audit -D first-pass
          python - <<'PY'
          import csv
          from research.recover_google_tiles import priority_unresolved_fsas
          with open('first-pass/google_all_ontario_498.csv', newline='') as f:
              rows=list(csv.DictReader(f))
          priority, dominated, cutoff=priority_unresolved_fsas(rows)
          print('ONTARIO_PRIORITY_TEST', dict(total=len(rows),priority=len(priority),
                dominated=len(dominated),cutoff=cutoff))
          assert len(rows)==498
          assert len(priority)==63, (len(priority),len(dominated),cutoff)
          assert len(dominated)==174, (len(priority),len(dominated),cutoff)
          assert 3000 < cutoff < 3200, cutoff
          PY
