name: Classify unresolved Ontario Google Maps businesses from verified place categories
on:
  push:
    paths: ['.github/workflows/ontario-google-category-recovery.yml']
  workflow_run:
    workflows:
      - Recheck remaining Ontario Google Maps ranking contenders
    types: [completed]
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  categorize:
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        fsa: ['N7M','L9L','L0M','K7G','N0L','K0B','N0G','K0L','P0G','L7M','M9M','M3L','N6M','N5V','L1A']
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ github.token }}
      FSA: ${{ matrix.fsa }}
      TARGET_RUN_ID: ${{ github.event.workflow_run.id || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ontario-401-fsa-live-ranking-20261121
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check that Google business categories never invent clinical evidence
        run: |
          python -m pip install -r requirements.txt
          python -m unittest research.test_google_category_evidence
          python -m playwright install --with-deps chromium
      - name: Restore original observed Google business evidence
        run: |
          set -euo pipefail
          mkdir -p category-enriched
          if [ -z "$TARGET_RUN_ID" ]; then
            TARGET_RUN_ID="$(gh run list --workflow ontario-google-31-targeted-recovery.yml --branch ontario-401-fsa-live-ranking-20261121 --status completed --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          fi
          if [ -z "$TARGET_RUN_ID" ]; then
            echo 'No complete recent Google FSA source run; refuse to manufacture listings' >&2
            exit 1
          fi
          echo "CATEGORY_ACTUAL_TARGETED_SOURCE=$TARGET_RUN_ID FSA=$FSA"
          # A newer targeted run may legitimately omit completed areas or
          # produce no artifact when its preflight fails. Reuse the preserved
          # 29-area source instead of classifying a missing/empty file.
          if ! gh run download "$TARGET_RUN_ID" -n "targeted-google-$FSA" -D category-enriched; then
            echo "No new checkpoint for $FSA; checking preserved prior source"
          fi
          mkdir -p previous-source
          if gh run download 45106178601 -n "targeted-google-$FSA" -D previous-source; then
            test -s "previous-source/$FSA.json"
          fi
          python - <<'PY'
          import json,shutil
          from pathlib import Path
          code='${{ matrix.fsa }}'
          newest=Path('category-enriched')/(code+'.json')
          prior=Path('previous-source')/(code+'.json')
          if not newest.is_file() and not prior.is_file():
              raise RuntimeError('No preserved Google source for '+code)
          old=json.loads(prior.read_text()) if prior.is_file() else None
          new=json.loads(newest.read_text()) if newest.is_file() else None
          for record in (old,new):
              if record and record.get('fsa')!=code:
                  raise RuntimeError('Google source identity mismatch '+code)
          if old and (not new or
                     not set(old.get('complete_tiles',{})).issubset(set(new.get('complete_tiles',{}))) or
                     int(new.get('unique_observed_local_places') or 0) <
                     int(old.get('unique_observed_local_places') or 0)):
              shutil.copy2(prior,newest)
              print('CATEGORY_REUSING_STRONGER_PRESERVED_SOURCE',code,flush=True)
          else:
              print('CATEGORY_REUSING_NEW_SOURCE' if new else 'CATEGORY_REUSING_PREVIOUS_SOURCE',code,flush=True)
          PY
          test -s "category-enriched/$FSA.json"
      - name: Verify unknown Google Maps categories against individual Google business detail pages
        timeout-minutes: 60
        run: |
          python -m research.enrich_google_categories "category-enriched/$FSA.json" --seconds 2900
      - name: Preserve every classification and unresolved category on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verified-google-categories-${{ matrix.fsa }}
          retention-days: 30
          if-no-files-found: warn
          path: category-enriched/${{ matrix.fsa }}.json
