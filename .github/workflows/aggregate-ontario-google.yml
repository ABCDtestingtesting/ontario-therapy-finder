name: Merge complete Google-only Ontario scans and prepare candidate verification
on:
  push:
    paths: ['.github/workflows/aggregate-ontario-google.yml']
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 59
    env:
      PYTHONUNBUFFERED: '1'
      THERAPY_DATA_HOME: ${{ github.workspace }}/official_2021_census
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Await complete geographically scoped 401+97 Google Maps scans
        timeout-minutes: 36
        run: |
          set -euo pipefail
          for attempt in $(seq 1 70); do
            runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?branch=ontario-401-fsa-live-ranking-20261121&per_page=100")
            large=$(echo "$runs" | jq -r '[.workflow_runs[] | select(.name == "Resolve Google locations provincewide across 401 FSAs")] | max_by(.id).id // empty')
            small=$(echo "$runs" | jq -r '[.workflow_runs[] | select(.name == "Resolve Google locations for Ontario small FSAs")] | max_by(.id).id // empty')
            if [ -n "$large" ] && [ -n "$small" ]; then
              a=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$large/artifacts?per_page=100" --jq '.total_count')
              b=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$small/artifacts?per_page=100" --jq '.total_count')
              echo "Source artifacts, run $large large: $a/32; run $small small: $b/12; attempt $attempt"
              if [ "$a" -ge 32 ] && [ "$b" -ge 12 ]; then
                echo "LARGE_GOOGLE_RUN=$large" >> "$GITHUB_ENV"
                echo "SMALL_GOOGLE_RUN=$small" >> "$GITHUB_ENV"
                exit 0
              fi
            fi
            sleep 30
          done
          echo "Complete fresh locally scoped Ontario Google scans not yet available" >&2
          exit 1
      - name: Download all first-pass Google-only evidence
        run: |
          gh run download "$LARGE_GOOGLE_RUN" -p 'resolved-large-*' -D raw-google
          gh run download "$SMALL_GOOGLE_RUN" -p 'resolved-small-*' -D raw-google
          test "$(find raw-google -name results.json | wc -l | tr -d ' ')" = 44
      - name: Install official census geo and population dependencies
        run: python -m pip install -r requirements.txt
      - name: Calculate 5km catchment population-to-Google competitors and screen 180
        timeout-minutes: 15
        run: python -m research.build_google_database raw-google google-only-output
      - name: Preserve preliminary candidate handoff without branch-write races
        uses: actions/upload-artifact@v4
        with:
          name: google-preliminary-180-handoff
          retention-days: 14
          path: google-only-output/preliminary_top_180.json
      - name: Preserve audited Ontario-wide database and ratio estimates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: google-all-ontario-498-population-ratio
          retention-days: 14
          if-no-files-found: warn
          path: |
            google-only-output/
