name: Live targeted PT directory statistic discovery
on:
  push:
    paths:
      - 'pt-weekly-mac/directory_index.py'
      - 'pt-weekly-mac/directory_snapshot.csv'
      - '.github/workflows/pt-directory-index.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  directory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate all 60 areas and scope
        run: cd pt-weekly-mac && python -m unittest -v test_directory_index.py
      - name: Live targeted directory index search
        run: python3 pt-weekly-mac/directory_index.py --out directory-evidence
      - name: Check actual coverage without falsely failing a completed survey
        run: |
          python - <<'PY'
          import csv
          with open("directory-evidence/directory-screening.csv") as f: rows=list(csv.DictReader(f))
          assert len(rows)==60
          assert all(r["count_status"] in ("indexed_statistic_retrieved","historical_snapshot_only","conflicting_index_statistics_historical_fallback") for r in rows)
          print("Index statistics recovered:",sum(r["count_status"]=="indexed_statistic_retrieved" for r in rows),"of 60; historical fallback is explicitly labelled")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PT-directory-statistics
          path: directory-evidence/
