name: Verify Google Maps update-results checkbox state across sequential tabs
on:
  push:
    paths: ['.github/workflows/probe-google-checkbox-persistence.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  state:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ontario-401-fsa-live-ranking-20261121
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install playwright
          python -m playwright install --with-deps firefox
      - name: Observe persisted checkbox state and local Google results after each tile
        run: |
          python - <<'PY'
          import json,time
          from playwright.sync_api import sync_playwright
          with sync_playwright() as pw:
            ctx=pw.firefox.launch_persistent_context('probe-profile',headless=True,viewport={'width':1400,'height':960},locale='en-CA')
            for n,place in enumerate([
              'psychotherapist/@44.281874,-79.954025,14z',
              'psychologist/@44.281874,-79.954025,14z',
              'psychotherapist/@44.292224,-79.954025,14z',
              'psychologist/@44.292224,-79.954025,14z']):
              page=ctx.new_page()
              url='https://www.google.com/maps/search/'+place+'?hl=en'
              page.goto(url,wait_until='domcontentloaded',timeout=35000)
              page.wait_for_timeout(1800)
              label=page.get_by_text('Update results when map moves')
              entry={'number':n,'url':page.url,'label_count':label.count()}
              if label.count():
                el=label.first
                def inspect():
                  return el.evaluate('''el => {
                    let ancestors=[],a=el;
                    for(let i=0;i<5&&a;i++,a=a.parentElement){
                      ancestors.push({tag:a.tagName,role:a.getAttribute('role'),
                        checked:a.getAttribute('aria-checked'),
                        class:a.className,html:a.outerHTML.slice(0,850)});
                    }
                    return {ancestors,otherCheckboxes:
                      [...document.querySelectorAll('[role="checkbox"],input[type="checkbox"]')]
                      .slice(0,12).map(x=>({outer:x.outerHTML.slice(0,400),checked:x.checked}))}
                  }''')
                entry['before']=inspect()
                label.first.click(timeout=5000)
                page.wait_for_timeout(800)
                entry['after_click']=inspect()
                for dx,dy in [(165,45),(-165,-45)]:
                  page.mouse.move(980,520);page.mouse.down();page.mouse.move(980+dx,520+dy,steps=14);page.mouse.up()
                  page.wait_for_timeout(2100)
                entry['after_map_move']=inspect()
              print('GOOGLE_CHECKBOX_STATE',json.dumps(entry),flush=True)
              page.close()
            ctx.close()
          PY
