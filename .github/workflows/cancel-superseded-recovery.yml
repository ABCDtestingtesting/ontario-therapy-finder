name: Cancel superseded recovery runs; retain latest category-aware evidence repair
on:
  push:
    paths: ['.github/workflows/cancel-superseded-recovery.yml']
  workflow_dispatch:
permissions:
  actions: write
  contents: read
jobs:
  stop-old:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Cancel only exact known superseded 48-shard searches
        run: |
          set -euo pipefail
          for run in 45107007933 45107032995; do
            status="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq '.status')"
            if [ "$status" = "queued" ] || [ "$status" = "in_progress" ] || [ "$status" = "waiting" ]; then
              gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$run/cancel" >/dev/null
              echo "CANCELLED_OBSOLETE_GOOGLE_RUN=$run"
            else
              echo "SKIP_COMPLETED_GOOGLE_RUN=$run"
            fi
          done
          echo 'CURRENT_TARGETED_SOURCE_RUN=45106178601_AND_AUTOMATIC_RESCUE_ON_COMPLETION'
