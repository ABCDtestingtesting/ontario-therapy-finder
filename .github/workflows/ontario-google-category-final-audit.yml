name: Recalculate Ontario Google 498 after live business-category recovery
on:
  push:
    paths: ['.github/workflows/ontario-google-category-final-audit.yml']
  workflow_run:
    workflows:
      - Classify unresolved Ontario Google Maps businesses from verified place categories
      - Recover all capped and incomplete Ontario Google Maps postal areas
      - Recheck remaining Ontario Google Maps ranking contenders
      - Resume only incomplete Ontario Google Maps source tiles
      - Probe final four Ontario Google ranking contenders with bounded local search
    types: [completed]
  workflow_dispatch:
    inputs:
      category_run_id:
        description: Completed Google place category verification run
        type: string
        required: true
permissions:
  actions: read
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      CATEGORY_RUN_ID: ${{ inputs.category_run_id || '' }}
      RECOVERY_RUN_ID: ${{ github.event.workflow_run.name == 'Recover all capped and incomplete Ontario Google Maps postal areas' && github.event.workflow_run.id || '' }}
      TARGET_RUN_ID: ${{ github.event.workflow_run.name == 'Recheck remaining Ontario Google Maps ranking contenders' && github.event.workflow_run.id || '' }}
      RETRY_RUN_ID: ${{ github.event.workflow_run.name == 'Resume only incomplete Ontario Google Maps source tiles' && github.event.workflow_run.id || '' }}
      FINAL_FOUR_RUN_ID: ${{ github.event.workflow_run.name == 'Probe final four Ontario Google ranking contenders with bounded local search' && github.event.workflow_run.id || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ontario-401-fsa-live-ranking-20261121
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Locate latest completed Google primary-category inspection
        run: |
          if [ -z "$CATEGORY_RUN_ID" ]; then
            CATEGORY_RUN_ID="$(gh run list --workflow ontario-google-category-recovery.yml --status completed --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          fi
          if [ -z "$CATEGORY_RUN_ID" ]; then
            echo 'Google category scan has not completed; do not certify' >&2
            exit 1
          fi
          echo "CATEGORY_RUN_ID=$CATEGORY_RUN_ID" >> "$GITHUB_ENV"
          echo "CATEGORY_SOURCE_RUN=$CATEGORY_RUN_ID"
      - name: Restore latest successful 48-shard source and census, preserving historical checkpoints
        run: |
          set -euo pipefail
          mkdir -p first-pass recovery-output category-results targeted-results native-results
          gh run download 44952655975 -n full-ontario-498-google-census-audit -D first-pass
          # Newest complete successful run, otherwise the known 48-artifact
          # historical checkpoint run. Never replace source with a cancelled
          # or partial recovery run.
          if [ -z "$RECOVERY_RUN_ID" ]; then
            RECOVERY_RUN_ID="$(gh run list --workflow ontario-google-tile-recovery.yml --branch ontario-401-fsa-live-ranking-20261121 --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          fi
          RECOVERY_RUN_ID="${RECOVERY_RUN_ID:-45070243739}"
          echo "RECOVERY_SOURCE_RUN=$RECOVERY_RUN_ID"
          gh run download "$RECOVERY_RUN_ID" -p 'google-tile-recovery-*' -D recovery-output
          if [ "$(find recovery-output -name '*.json' | wc -l | tr -d ' ')" -ne 241 ]; then
            echo 'Newest recovery run incomplete; revert to proven full 48-shard checkpoint' >&2
            rm -rf recovery-output
            mkdir -p recovery-output
            gh run download 45070243739 -p 'google-tile-recovery-*' -D recovery-output
          fi
          if [ -z "$TARGET_RUN_ID" ]; then
            TARGET_RUN_ID="$(gh run list --workflow ontario-google-31-targeted-recovery.yml --branch ontario-401-fsa-live-ranking-20261121 --status completed --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          fi
          TARGET_RUN_ID="${TARGET_RUN_ID:-45078523814}"
          echo "TARGETED_SOURCE_RUN=$TARGET_RUN_ID"
          # Preserve all 29 checkpoint FSAs from the earlier verified local
          # search. The latest run deliberately covers only 13; overwriting
          # the full set with its subset had regressed 10 completed FSAs.
          gh run download 45106178601 -p 'targeted-google-*' -D targeted-results
          mkdir -p newer-targeted
          gh run download "$TARGET_RUN_ID" -p 'targeted-google-*' -D newer-targeted || true
          python - <<'PY'
          import json,shutil
          from pathlib import Path
          old_root=Path('targeted-results')
          for new_path in Path('newer-targeted').glob('**/[A-Z][0-9][A-Z].json'):
              code=new_path.stem
              prior=list(old_root.glob('**/'+code+'.json'))
              if len(prior)!=1:
                  raise RuntimeError('Missing unique preserved Google checkpoint '+code)
              old=json.loads(prior[0].read_text())
              new=json.loads(new_path.read_text())
              if old.get('fsa')!=code or new.get('fsa')!=code:
                  raise RuntimeError('Mismatched Google checkpoint identity')
              if (set(old.get('complete_tiles',{})).issubset(set(new.get('complete_tiles',{}))) and
                  int(old.get('unique_observed_local_places') or 0)<=
                  int(new.get('unique_observed_local_places') or 0) and
                  not (old.get('status')=='verified_tile_feed' and
                       new.get('status')!='verified_tile_feed')):
                  shutil.copy2(new_path,prior[0])
                  print('PRESERVED_STRONGER_NEW_GOOGLE_SOURCE',code,flush=True)
              else:
                  print('KEPT_STRONGER_OLD_GOOGLE_SOURCE',code,flush=True)
          PY
          gh run download 45047774153 -p 'native-google-*' -D native-results
          test -s first-pass/google_all_ontario_498.csv
          test "$(find recovery-output -name '*.json' | wc -l | tr -d ' ')" = 241
      - name: Overlay only evidence-preserving Google FSA retries
        run: |
          set -euo pipefail
          if [ -z "$RETRY_RUN_ID" ]; then
            RETRY_RUN_ID="$(gh run list --workflow ontario-google-tile-rescue.yml --status completed --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          fi
          if [ -n "$RETRY_RUN_ID" ] && gh run download "$RETRY_RUN_ID" -p 'resumed-google-*' -D retry-results; then
            python - <<'PY'
          import json,shutil
          from pathlib import Path
          original=Path('targeted-results')
          repaired=Path('retry-results')
          used=[]
          ignored=[]
          for p in repaired.glob('**/[A-Z][0-9][A-Z].json'):
              code=p.stem
              candidate=json.loads(p.read_text())
              if candidate.get('fsa')!=code:
                  raise RuntimeError('Rescue FSA identity mismatch '+code)
              prior=list(original.glob('**/'+code+'.json'))
              if len(prior)>1:
                  raise RuntimeError('Duplicate targeted Google checkpoint '+code)
              if prior:
                  before=json.loads(prior[0].read_text())
                  if not set(before.get('complete_tiles',{})).issubset(
                        set(candidate.get('complete_tiles',{}))):
                      ignored.append(code+':prior_queries_not_preserved')
                      continue
                  if int(candidate.get('unique_observed_local_places') or 0) < int(
                        before.get('unique_observed_local_places') or 0):
                      ignored.append(code+':prior_places_not_preserved')
                      continue
                  destination=prior[0]
              else:
                  destination=original/('targeted-google-'+code)/(code+'.json')
                  destination.parent.mkdir(parents=True,exist_ok=True)
              shutil.copy2(p,destination)
              used.append(code)
          report={'retry_run_id':'$RETRY_RUN_ID',
                  'repaired_google_fsa':sorted(used),
                  'rejected_incomplete_merges':ignored}
          Path('google_retry_merge_report.json').write_text(json.dumps(report,indent=2))
          print('GOOGLE_RETRY_MERGE',json.dumps(report),flush=True)
          PY
          fi
      - name: Restore only complete final-four Google evidence artifacts
        run: |
          set -euo pipefail
          if [ -z "$FINAL_FOUR_RUN_ID" ]; then
            FINAL_FOUR_RUN_ID="$(gh run list --workflow ontario-google-final-four-probes.yml --branch ontario-401-fsa-live-ranking-20261121 --status completed --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          fi
          if [ -n "$FINAL_FOUR_RUN_ID" ]; then
            mkdir -p final-four-results
            if gh run download "$FINAL_FOUR_RUN_ID" -p 'four-probe-google-*' -D final-four-results; then
              echo "FINAL_FOUR_SOURCE_RUN=$FINAL_FOUR_RUN_ID"
            else
              echo 'No complete final-four Google evidence yet; preserving previous evidence'
            fi
          fi
      - name: Load saved newer Google detail-page classifications
        run: |
          gh run download "$CATEGORY_RUN_ID" -p 'verified-google-categories-*' -D category-results
      - name: Merge without dropping historical source observations
        run: |
          python -m compileall -q research/merge_google_checkpoints.py research/test_google_checkpoint_merge.py research/finalize_full_google_498.py
          python -m unittest research.test_google_checkpoint_merge research.test_google_category_evidence research.test_google_exterior_place research.test_k7g_uncapped_zoom research.test_external_clinical_adjudications -v
          python - <<'PY'
          import json
          from pathlib import Path
          from research.merge_google_checkpoints import combine_google_checkpoints
          source = Path('recovery-output')
          targeted = Path('targeted-results')
          categories = Path('category-results')
          original = list(source.glob('**/[A-Z][0-9][A-Z].json'))
          if len(original) != 241 or len({p.stem for p in original}) != 241:
              raise RuntimeError(f'Expected all 241 original checkpoint locations; found {len(original)}')
          current = {p.stem:p for p in original}
          latest = {}
          rejected = []
          skipped_superseded = []
          for f in targeted.glob('**/[A-Z][0-9][A-Z].json'):
              if f.stem not in current:
                  raise RuntimeError('Unexpected FSA in updated Google checkpoint: '+f.stem)
              old = json.loads(current[f.stem].read_text())
              new = json.loads(f.read_text())
              if new.get('fsa') != f.stem or old.get('fsa') != f.stem:
                  raise RuntimeError('Mismatched source FSA identity')
              merged, reason = combine_google_checkpoints(old, new)
              if merged is old:
                  skipped_superseded.append(f.stem+':'+reason)
                  continue
              latest[f.stem] = merged
              current[f.stem].write_text(json.dumps(merged,indent=2))
          # Final-four probes augment the Google lower bound with actual
          # geographically resolved place IDs. Never manufacture a verified
          # end-of-feed when the underlying 18-query source remains capped.
          final_four_used = []
          for path in Path('final-four-results').glob('**/[A-Z][0-9][A-Z].json'):
              code = path.stem
              if code not in current:
                  raise RuntimeError('Unknown final-four Google source '+code)
              original = json.loads(current[code].read_text())
              new = json.loads(path.read_text())
              merged, reason = combine_google_checkpoints(original,new)
              if merged is original:
                  print('SKIP_WEAKER_FINAL_FOUR_SOURCE',code,reason,flush=True)
                  continue
              if not set(original.get('complete_tiles',{})).issubset(set(merged.get('complete_tiles',{}))):
                  raise RuntimeError('Final-four merge lost source tiles '+code)
              current[code].write_text(json.dumps(merged,indent=2))
              final_four_used.append(code)
          print('FINAL_FOUR_GOOGLE_EVIDENCE_MERGE',sorted(final_four_used),flush=True)
          enriched = {}
          for f in categories.glob('**/[A-Z][0-9][A-Z].json'):
              code = f.stem
              if code not in current:
                  raise RuntimeError('Unknown classified FSA: '+code)
              category_doc = json.loads(f.read_text())
              present = json.loads(current[code].read_text())
              if category_doc.get('fsa') != code or present.get('fsa') != code:
                  raise RuntimeError('Category source mismatch')
              old_places = {p['key']:p for p in present.get('local_places',[])}
              classified_places = {p['key']:p for p in category_doc.get('local_places',[])}
              # Newer full recovery scans may contain additional real Google
              # places absent from older category artifacts. Retain these
              # as unclassified evidence; match only canonical place keys.
              unmatched_new_places = len(set(old_places)-set(classified_places))
              additions = 0
              for key,place in old_places.items():
                  update = classified_places.get(key)
                  if update and update.get('google_business_category') and update.get('google_category_evidence_url'):
                      for k in ('google_business_category','google_category_evidence_url','google_category_checked_at'):
                          place[k] = update.get(k)
                      additions += 1
              present['category_enrichment_report'] = category_doc.get('category_enrichment_report',{})
              present['local_places'] = list(old_places.values())
              current[code].write_text(json.dumps(present,indent=2))
              enriched[code] = additions
          report={'original_recovery_checkpoints':len(original),
                  'targeted_checkpoint_merges':len(latest),
                  'classified_fsa':len(enriched),
                  'places_with_google_business_categories_by_fsa':enriched,
                  'superseded_targeted_checkpoints':skipped_superseded,
                  'rejected_merges':rejected}
          Path('category_merge_audit.json').write_text(json.dumps(report,indent=2))
          print('GOOGLE_CATEGORY_MERGE_AUDIT',json.dumps(report),flush=True)
          if rejected:
              raise RuntimeError('Source evidence reconciliation failures; full audit preserved')
          PY
      - name: Verify external office location of one locationless Google Maps place
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from research.review_google_exterior_place import adjudicate_n0l
          paths=list(Path('recovery-output').glob('**/N0L.json'))
          if len(paths)!=1:
              raise RuntimeError('Expected unique N0L source checkpoint')
          doc=json.loads(paths[0].read_text())
          adjudicate_n0l(doc)
          if doc.get('externally_verified_exterior_links'):
              print('N0L_PRIMARY_LOCATION_EXTERNALLY_VERIFIED_OUTSIDE_RADIUS',
                    doc['externally_verified_exterior_links'][0]['office_address'],flush=True)
              paths[0].write_text(json.dumps(doc,indent=2))
          PY
      - name: Reconcile K7G uncapped verified local-zoom Google source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p k7g-zoom
          gh run download 45217828105 -n final-two-google-K7G -D k7g-zoom
          test -s k7g-zoom/K7G.json
          python - <<'PY'
          import json
          from pathlib import Path
          from research.adjudicate_k7g_uncapped_zoom import retain_verified_k7g_or_reconcile
          found=list(Path('recovery-output').glob('**/K7G.json'))
          if len(found)!=1:raise RuntimeError('Expected unique complete original K7G checkpoint')
          before=json.loads(found[0].read_text())
          probe=json.loads(Path('k7g-zoom/K7G.json').read_text())
          reviewed=retain_verified_k7g_or_reconcile(before,probe)
          if reviewed['status']!='verified_tile_feed' or reviewed['capped_leaf_tiles']!=0:
              raise RuntimeError('K7G local map source still incomplete')
          found[0].write_text(json.dumps(reviewed,indent=2))
          print('K7G_VERIFIED_LATEST_UNCAPPED_SOURCE_OLD_CAP_PRESERVED',flush=True)
          PY
      - name: Restore original item-level clinical evidence across all 498 FSAs
        run: |
          set -euo pipefail
          mkdir -p original-clinical-source
          gh run download 45317051215 -R "$GITHUB_REPOSITORY" -n ontario-498-original-google-clinical-business-evidence -D original-clinical-source
          test -s original-clinical-source/Ontario_498_Firstpass_Verified_Clinical_Lower_Bounds.csv
      - name: Audit all 498 with clinically verified businesses only; certify only if every competitor is bounded
        run: |
          python -m research.finalize_full_google_498 first-pass/google_all_ontario_498.csv recovery-output audited-google-498 --native-root native-results --original-clinical-audit original-clinical-source/Ontario_498_Firstpass_Verified_Clinical_Lower_Bounds.csv
      - name: Preserve complete 498 audit, provisional 60, unresolved areas and certification status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: google-498-category-verified-full-audit
          retention-days: 30
          if-no-files-found: warn
          path: |
            audited-google-498/
            category_merge_audit.json
            google_retry_merge_report.json
