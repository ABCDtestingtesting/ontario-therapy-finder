name: Focused live-source Mac diagnostics

on:
  push:
    paths:
      - '.github/workflows/source-diagnostics.yml'
      - 'finder/**'
      - 'tests/**'
      - 'ci/**'
      - 'start.command'
      - 'requirements.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-source-diagnostics:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    env:
      CI: 'true'
      PYTHONUNBUFFERED: '1'
      THERAPY_DATA_HOME: ${{ github.workspace }}/ci_private_data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies and Firefox
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install firefox
      - name: Fast collector and census regression tests
        run: python -m pytest -vv tests/test_census.py tests/test_maps.py tests/test_google_browser.py tests/test_pt_live_pagination.py
        timeout-minutes: 5
      - name: Actual Statistics Canada boundaries and catchment
        if: always()
        continue-on-error: true
        run: python ci/run_stage.py census --timeout 2100
      - name: Actual Google Maps Firefox browser search
        if: always()
        continue-on-error: true
        run: python ci/run_stage.py maps --timeout 330
      - name: Actual Psychology Today listings
        if: always()
        continue-on-error: true
        run: python ci/run_stage.py psychology_today --timeout 600
      - name: Actual Street View housing screenshot
        if: always()
        continue-on-error: true
        run: python ci/run_stage.py housing_capture --timeout 600
      - name: Fail if any live source unverified
        if: always()
        run: |
          python - <<'PY'
          import json,sys
          from pathlib import Path
          sources=('census','maps','psychology_today','housing_capture')
          results={}
          for source in sources:
            file=Path('ci_results')/(source+'.json')
            try:results[source]=json.loads(file.read_text())['status']
            except (FileNotFoundError,ValueError,KeyError):results[source]='missing'
          print('Verified source status:',results)
          if any(x!='passed' for x in results.values()):sys.exit(1)
          PY
      - name: Upload full failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: focused-source-${{ matrix.os }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            ci_results/
            ci_private_data/ci_google_firefox/
            ci_private_data/areas/*/housing/*.png
            ci_private_data/areas/*/pt/*.png
