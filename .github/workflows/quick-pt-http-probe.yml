name: Quick PT first-page HTTP feasibility check
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/quick-pt-http-probe.yml'
permissions:
  contents: read
jobs:
  first-page:
    runs-on: macos-15
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test first-page directory count without a grid or browser installation
        run: |
          python - <<'PY'
          from urllib.request import Request,urlopen
          from urllib.error import HTTPError,URLError
          import re,html
          url='https://www.psychologytoday.com/ca/therapists/n4g'
          req=Request(url,headers={'User-Agent':'Mozilla/5.0 (Macintosh; Intel Mac OS X 13.0; rv:129.0) Gecko/20100101 Firefox/129.0','Accept':'text/html,application/xhtml+xml','Accept-Language':'en-CA,en;q=0.8'})
          try:
              with urlopen(req,timeout=24) as res:
                  raw=res.read(2500000).decode('utf-8','replace')
                  text=re.sub(r'<[^>]+>',' ',re.sub(r'<(script|style)\\b[^>]*>.*?</\\1>',' ',raw,flags=re.S|re.I))
                  text=html.unescape(re.sub(r'\\s+',' ',text))
                  found=re.search(r'Number\\s+of\\s+Counsellors\\s+in\\s+N4G\\s*([\\d,]+)\\s*(\\+?)',text,re.I)
                  print('HTTP:',res.status,'bytes:',len(raw),'directory_heading:',bool(re.search('Therapists in N4G',text)),'displayed_count:',found.group(0) if found else 'NOT_PARSED')
          except (HTTPError,URLError,TimeoutError,OSError) as e:
              print('ACCESS RESTRICTION OR NETWORK FAILURE:',repr(e))
              print('Manual PT browser fallback would be required.')
          PY
