name: Stop obsolete testing runs

on:
  push:
    paths: ['.github/workflows/stop-obsolete.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  stop-old:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel only obsolete revisions' runs
        uses: actions/github-script@v7
        with:
          script: |
            const old = [44864955517, 44865801809];
            for (const run_id of old) {
              const response = await github.rest.actions.getWorkflowRun({owner: context.repo.owner, repo: context.repo.repo, run_id});
              if (response.data.status === 'completed') {
                core.info(`Already finished ${run_id}`);
                continue;
              }
              await github.rest.actions.cancelWorkflowRun({owner: context.repo.owner, repo: context.repo.repo, run_id});
              core.info(`Cancelled obsolete run ${run_id}`);
            }
