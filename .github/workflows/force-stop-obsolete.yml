name: Force-stop obsolete revisions
on:
  push:
    paths: ['.github/workflows/force-stop-obsolete.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  force:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            for (const run_id of [44905006501, 44905006513]) {
              const run = (await github.rest.actions.getWorkflowRun({
                owner: context.repo.owner, repo: context.repo.repo, run_id
              })).data;
              if (run.status === 'completed') {
                core.info(`Old run ${run_id} already complete`);
                continue;
              }
              await github.request('POST /repos/{owner}/{repo}/actions/runs/{run_id}/force-cancel',{
                owner: context.repo.owner, repo: context.repo.repo, run_id
              });
              core.info(`Force cancellation requested for obsolete run ${run_id}`);
            }
