name: Force-stop obsolete revisions
on:
  push:
    paths: ['.github/workflows/force-stop-obsolete.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  force:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            for (const run_id of [44913412178, 44913412167, 44913394786, 44913394781, 44913300639, 44913300577, 44913284174, 44913284164, 44913190553, 44913190490, 44913173979, 44913173872, 44913161140, 44913161127, 44913130557, 44913130539, 44922006049, 44922237847, 44922005981, 44922237797, 44947436773, 44948460865, 44948487336, 44949323753, 44949320101, 44949192270]) {
              const run = (await github.rest.actions.getWorkflowRun({
                owner: context.repo.owner, repo: context.repo.repo, run_id
              })).data;
              if (run.status === 'completed') {
                core.info(`Old run ${run_id} already complete`);
                continue;
              }
              try {
                await github.request('POST /repos/{owner}/{repo}/actions/runs/{run_id}/force-cancel',{
                  owner: context.repo.owner, repo: context.repo.repo, run_id
                });
                core.info(`Cancellation requested for obsolete run ${run_id}`);
              } catch (e) {
                // Jobs may have completed between lookup and cancellation.
                core.info(`Old run ${run_id} could not be cancelled: ${e.status || e.message}`);
              }
            }

            const recent = (await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              branch: 'ontario-401-fsa-live-ranking-20261121', per_page: 100
            })).data.workflow_runs;
            const preferLatest = [
              'Resolve Google locations provincewide across 401 FSAs',
              'Resolve Google locations for Ontario small FSAs'
            ];
            for (const workflowName of preferLatest) {
              const matching = recent.filter(r => r.name === workflowName)
                .sort((a,b) => b.id - a.id);
              if (!matching.length) continue;
              core.info('Preserving latest source run '+matching[0].id+' for '+workflowName);
              for (const older of matching.slice(1)) {
                if (older.status === 'completed') continue;
                try {
                  await github.request('POST /repos/{owner}/{repo}/actions/runs/{run_id}/force-cancel',{
                    owner:context.repo.owner,repo:context.repo.repo,run_id:older.id
                  });
                  core.info('Cancelled superseded Google source run '+older.id);
                } catch(e) { core.info('Could not cancel '+older.id+': '+e.message); }
              }
            }
