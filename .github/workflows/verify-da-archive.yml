name: Verify official DA archive fallback against real 2021 data
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/verify-da-archive.yml'
      - 'finder/census.py'
      - 'tests/test_da_archive_fallback.py'
permissions:
  contents: read
jobs:
  real-da-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    env:
      THERAPY_DATA_HOME: ${{ github.workspace }}/da_archive_data
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install geospatial requirements
        run: python -m pip install -r requirements.txt
      - name: Validate DA failure-recovery tests
        run: python -m pytest -q tests/test_da_archive_fallback.py
      - name: Download real DA archive and validate L7A polygons
        timeout-minutes: 23
        run: |
          python - <<'PY'
          from finder import census
          from shapely.geometry import shape,box
          bbox=(-79.9639370,43.5934308,-79.7224761,43.7927234)
          result=census._da_archive_fallback(bbox,print)
          assert len(result)>=100, f'Ontario L7A catchment DA count unexpectedly low: {len(result)}'
          for code,geom in result.items():
              assert code.startswith('35') and len(code)==8
              g=shape(geom)
              assert not g.is_empty and g.is_valid and g.intersects(box(*bbox))
          print('REAL SOURCE ARCHIVE PASSED:',len(result),'DA polygons; verified source and coordinates')
          PY
      - name: Retain download provenance and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-2021-da-archive-check
          retention-days: 7
          if-no-files-found: warn
          path: |
            da_archive_data/da_archive_provenance.json
            da_archive_data/da_boundaries/
