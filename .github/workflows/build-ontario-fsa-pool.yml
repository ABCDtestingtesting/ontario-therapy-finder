name: Build official Ontario FSA candidate pool
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-ontario-fsa-pool.yml'
permissions:
  contents: write
jobs:
  official-pool:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    env:
      THERAPY_DATA_HOME: ${{ github.workspace }}/fsa_pool_private
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install official census importer
        run: python -m pip install -r requirements.txt
      - name: Compile Ontario populated FSA candidates
        run: |
          python - <<'PY'
          from finder import census
          import json
          from pathlib import Path
          shapes=census.fsa_geometry(print)
          pops=census.load_population('fsa',print)
          out=[]
          for fsa,poly in shapes.items():
              if fsa in census.HAMILTON_POSTAL_AREAS:continue
              d=pops.get(fsa)
              if not d or d['population']<12000:continue
              lat,lon=census.representative(poly)
              out.append({'fsa':fsa,'lat':round(lat,6),'lon':round(lon,6),
                          'population_2021':int(d['population'])})
          out.sort(key=lambda r:r['fsa'])
          assert len(out)>=150, 'Far too few eligible Ontario populated FSAs'
          Path('ontario_fsa_pool.json').write_text(json.dumps(
              {'source':'Statistics Canada 2021 FSA boundaries + populations',
               'min_population':12000,'areas':out},indent=2))
          print('OFFICIAL_ON_FSA_POOL',len(out),flush=True)
          print('FIRST_12',out[:12],flush=True)
          PY
      - name: Publish exact source-derived coordinates as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ontario-eligible-fsa-pool
          retention-days: 7
          path: ontario_fsa_pool.json
      - name: Retain official candidate pool on diagnostic branch
        run: |
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          cp ontario_fsa_pool.json /tmp/ontario_fsa_pool_preserved.json
          git fetch origin ci-diagnostics
          git checkout -B ci-diagnostics origin/ci-diagnostics
          # checkout does not remove untracked generated output
          cp /tmp/ontario_fsa_pool_preserved.json official_ontario_fsa_pool.json
          git add official_ontario_fsa_pool.json
          if ! git diff --cached --quiet; then
            git commit -m "Official Ontario FSA coordinates (2021 data) [skip ci]"
            git push origin HEAD:ci-diagnostics
          fi
