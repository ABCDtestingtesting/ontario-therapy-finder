name: Recheck remaining Ontario Google Maps ranking contenders
on:
  push:
    branches:
      - ontario-401-fsa-live-ranking-20261121
    paths:
      - '.github/workflows/ontario-google-31-targeted-recovery.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  targeted-google:
    name: Recheck Google Maps ${{ matrix.fsa }}
    runs-on: ubuntu-latest
    timeout-minutes: 83
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        fsa: ['N7M', 'L0M', 'K7G', 'N0L', 'K0B', 'N0G', 'K0L', 'P0G', 'L7M', 'M9M', 'M3L', 'N6M', 'N5V']
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: '1'
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recover original 498 FSA census and Google observations
        run: |
          mkdir -p first-pass
          gh run download 44952655975 -n full-ontario-498-google-census-audit -D first-pass
          test -s first-pass/google_all_ontario_498.csv
      - name: Locate exact original recovery artifact shard for this FSA
        id: source-shard
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import csv, json
          from pathlib import Path
          with Path('first-pass/google_all_ontario_498.csv').open(newline='') as f:
              prior = list(csv.DictReader(f))
          incomplete = {r['fsa'] for r in prior if r['status'] != 'confirmed_observed_feed'}
          all_areas = json.loads(Path('research/ontario_all_populated_fsa_2021.json').read_text())['areas']
          ordered = [a['fsa'] for a in all_areas if a['fsa'] in incomplete]
          if len(ordered) != 241:
              raise RuntimeError('Original checkpoint plan changed')
          code = '${{ matrix.fsa }}'
          if code not in ordered:
              raise RuntimeError(f'No original recovery task for {code}')
          shard = ordered.index(code) % 48
          print(f'shard={shard}')
          PY
      - name: Reuse only the matching Google Maps checkpoint artifact
        run: |
          mkdir -p recovery-seed
          gh run download 45101079788 -n "google-tile-recovery-${{ steps.source-shard.outputs.shard }}" -D recovery-seed
          python - <<'PY'
          from pathlib import Path
          code = '${{ matrix.fsa }}'
          found = list(Path('recovery-seed').glob('**/' + code + '.json'))
          if len(found) != 1:
              raise RuntimeError(f'Expected one prior checkpoint for {code}, found {len(found)}')
          print('FOUND_ORIGINAL_GOOGLE_CHECKPOINT',code,found[0])
          PY
      - name: Restore latest evidence-preserving targeted checkpoint
        run: |
          set -euo pipefail
          code="${{ matrix.fsa }}"
          mkdir -p "targeted-google/$code"
          if gh run download 45106178601 -n "targeted-google-$code" -D "targeted-google/$code"; then
            test -s "targeted-google/$code/$code.json"
            python - <<'PY'
          import json
          from pathlib import Path
          code='${{ matrix.fsa }}'
          target=Path('targeted-google')/code/(code+'.json')
          base=list(Path('recovery-seed').glob('**/'+code+'.json'))
          if len(base)!=1:raise RuntimeError('Original recovery checkpoint not unique')
          original=json.loads(base[0].read_text())
          current=json.loads(target.read_text())
          if current.get('fsa')!=code or original.get('fsa')!=code:
              raise RuntimeError('Targeted checkpoint identity mismatch')
          if not set(original.get('complete_tiles',{})).issubset(set(current.get('complete_tiles',{}))):
              raise RuntimeError('Targeted checkpoint lost original completed searches')
          if int(current.get('unique_observed_local_places') or 0)<int(original.get('unique_observed_local_places') or 0):
              raise RuntimeError('Targeted checkpoint lost original locations')
          print('REUSED_TARGETED_GOOGLE_CHECKPOINT',code,len(current.get('complete_tiles',{})),flush=True)
          PY
          else
            echo "No targeted checkpoint for $code; using original shard evidence"
          fi
      - name: Install and validate Google Maps browser collector
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps firefox
          python -m compileall -q research/recheck_google_contenders.py research/recover_google_tiles.py research/google_measured_recenter_runner.py finder/google_browser.py
          python -m unittest research.test_google_checkbox_state research.test_google_bounded_recovery research.test_google_partial_lower_bounds -v
      # Independent live four-tab test proved the Google checkbox persists across
      # tabs. The collector enables it only when aria-checked=false; preflight
      # regression passed in GitHub Actions run 45106109602.
      - name: Verify localized query keys before resuming Google checkpoints
        run: |
          python - <<'PY'
          from research.recover_google_tiles import SEARCHES, tile_tasks, task_key
          assert len(list(tile_tasks())) == 18
          assert SEARCHES == ('psychotherapist', 'psychologist')
          assert all('{FSA}' not in term for term in SEARCHES)
          assert all(task_key(t).startswith('map_movement_v7_checkbox_on|') for t in tile_tasks())
          assert '0.0|0.0|0|psychotherapist' not in {task_key(t) for t in tile_tasks()}
          print('GOOGLE_LOCAL_SEARCH_PLAN', SEARCHES)
          PY
      - name: Complete outstanding Google Maps local source tiles
        timeout-minutes: 66
        run: |
          python -m research.google_measured_recenter_runner --fsa "${{ matrix.fsa }}" --seconds 3500
      - name: Save updated Google raw business search checkpoint even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: targeted-google-${{ matrix.fsa }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            targeted-google/${{ matrix.fsa }}/${{ matrix.fsa }}.json
            targeted-google/${{ matrix.fsa }}/evidence/
