name: Retry only incomplete independent Ontario Google zero-area checks
on:
  workflow_run:
    workflows:
      - Independently verify all 53 zero-count Ontario Google Maps FSAs
    types: [completed]
  workflow_dispatch:
    inputs:
      source_run:
        description: Prior independent 53-area source run
        required: false
        type: string
permissions:
  contents: read
  actions: read
jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      fsas: ${{ steps.pick.outputs.fsas }}
      count: ${{ steps.pick.outputs.count }}
      source_run: ${{ steps.pick.outputs.source_run }}
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN: ${{ inputs.source_run || github.event.workflow_run.id || '' }}
    steps:
      - name: Identify only incomplete or absent previously observed FSA searches
        id: pick
        run: |
          set -euo pipefail
          test -n "$SOURCE_RUN"
          mkdir -p previous-zeros
          gh run download "$SOURCE_RUN" -p 'independent-zero-*' -D previous-zeros || true
          echo "source_run=$SOURCE_RUN" >> "$GITHUB_OUTPUT"
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          all_fsas='L9E L7C K7L N7M L9W N4N L9L P4N L0B L0M N2Z N0B K8A K7G P3L K0A P3P N0E P3E L0A N0L N0J P9A K0C K0K K7V K0B N0G P8N K0G N0H K0L K0H P7A P0N P0C K0J P0G P0P P7G P7L P0J P0H P0R P0Y P0K P0M P0S P0W P0X P0T P0L P0V'.split()
          if len(all_fsas)!=53 or len(set(all_fsas))!=53:
              raise RuntimeError('FSA candidate plan changed')
          chosen=[]
          for code in all_fsas:
              paths=list(Path('previous-zeros').glob('**/'+code+'.json'))
              if len(paths)>1:raise RuntimeError('Ambiguous saved Google source '+code)
              if len(paths)==0:
                  chosen.append(code)
                  continue
              doc=json.loads(paths[0].read_text())
              if doc.get('fsa')!=code:raise RuntimeError('Google source FSA identity changed')
              if doc.get('status')!='all_27_independent_google_feeds_observed':
                  chosen.append(code)
          print('fsas='+json.dumps(chosen,separators=(',',':')))
          print('count='+str(len(chosen)))
          PY
  retry:
    needs: select
    if: needs.select.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 58
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        fsa: ${{ fromJSON(needs.select.outputs.fsas) }}
    env:
      GH_TOKEN: ${{ github.token }}
      CI: 'true'
      PYTHONUNBUFFERED: '1'
      SOURCE_RUN: ${{ needs.select.outputs.source_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ontario-401-fsa-live-ranking-20261121
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore original 498 census, source and exact Google partial checkpoint
        run: |
          set -euo pipefail
          mkdir -p first-pass
          gh run download 45219618676 -n google-498-category-verified-full-audit -D first-pass
          test -s first-pass/audited-google-498/ontario_498_google_recovery_audit.csv
          mkdir -p independent-zero/${{ matrix.fsa }}
          mkdir -p saved
          if gh run download "$SOURCE_RUN" -n 'independent-zero-${{ matrix.fsa }}' -D saved; then
            test -s saved/${{ matrix.fsa }}.json
            cp saved/${{ matrix.fsa }}.json independent-zero/${{ matrix.fsa }}/${{ matrix.fsa }}.json
          fi
      - name: Install and validate independent geographical source collector
        run: |
          python -m pip install -r requirements.txt
          python -m compileall -q research/verify_zero_google_coverage.py
          python -m unittest research.test_google_checkbox_state research.test_google_bounded_recovery -v
          python -m playwright install --with-deps firefox
      - name: Recover only still-pending Google category-map queries
        timeout-minutes: 46
        run: |
          python -m research.verify_zero_google_coverage --fsa "${{ matrix.fsa }}" --baseline first-pass/audited-google-498/ontario_498_google_recovery_audit.csv --out independent-zero/${{ matrix.fsa }}/${{ matrix.fsa }}.json --seconds 2500
      - name: Preserve every actual business and incomplete Google result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-zero-retry-${{ matrix.fsa }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            independent-zero/${{ matrix.fsa }}/${{ matrix.fsa }}.json
            independent-zero/${{ matrix.fsa }}/evidence/
