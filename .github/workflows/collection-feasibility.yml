name: Full area workload and collection feasibility audit
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/collection-feasibility.yml'
      - 'ci/assess_collection_feasibility.py'
permissions:
  contents: read
jobs:
  quantify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      THERAPY_DATA_HOME: ${{ github.workspace }}/feasibility_private_data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Count actual full area Google Maps searches
        run: python -m ci.assess_collection_feasibility
      - name: Save quantified workload and source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-area-feasibility
          retention-days: 7
          path: ci/collection_feasibility.json
