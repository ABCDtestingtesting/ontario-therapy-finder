name: Publish two stage Mac CI run identifiers
on:
  push:
    paths: ['.github/workflows/twostage-mac-index.yml']
permissions:
  contents: write
  actions: read
jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Snapshot isolated test jobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?branch=twostage-live-mac-verify&per_page=20" --jq '.workflow_runs[] | [.id,.name,.status,(.conclusion // ""),.head_sha,.html_url] | @tsv' > /tmp/twostage-runs.tsv
          : > /tmp/twostage-jobs.tsv
          while IFS=$'\t' read -r run_id name status conclusion sha url; do
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100" --jq '.jobs[] | [.id,.name,.status,(.conclusion // ""),.html_url] | @tsv' >> /tmp/twostage-jobs.tsv || true
          done < /tmp/twostage-runs.tsv
      - name: Keep status in diagnostic branch
        run: |
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin ci-diagnostics
          git checkout -B ci-diagnostics origin/ci-diagnostics
          cp /tmp/twostage-runs.tsv twostage-mac-runs.tsv
          cp /tmp/twostage-jobs.tsv twostage-mac-jobs.tsv
          git add twostage-mac-runs.tsv twostage-mac-jobs.tsv
          if ! git diff --cached --quiet; then
            git commit -m "Record two-stage exact ZIP Mac verification [skip ci]"
            git push origin HEAD:ci-diagnostics
          fi