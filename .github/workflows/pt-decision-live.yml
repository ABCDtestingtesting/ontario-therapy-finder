name: PT Decision real macOS acceptance
on:
  push:
    paths:
      - 'pt-weekly-mac/decision_live_check.py'
      - '.github/workflows/pt-decision-live.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    runs-on: macos-15
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the same Firefox browser dependency as the local package
        run: |
          python -m pip install playwright
          python -m playwright install firefox
      - name: Verify actual directory pagination and elapsed runtime
        run: python -u pt-weekly-mac/decision_live_check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: actual-PT-decision-live-evidence
          path: |
            decision-live-evidence/status.json
            decision-live-evidence/areas.csv
            decision-live-evidence/pages.json
            decision-live-evidence/restriction.png
