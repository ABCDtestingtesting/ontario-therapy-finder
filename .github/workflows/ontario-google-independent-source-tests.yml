name: Validate independent zero-FSA source evidence and clinical safeguards
on:
  push:
    branches: [ontario-401-fsa-live-ranking-20261121]
    paths:
      - '.github/workflows/ontario-google-independent-source-tests.yml'
      - 'research/test_independent_zero_source.py'
      - 'research/test_google_category_evidence.py'
      - 'research/test_independent_rank_dominance.py'
      - 'research/reconcile_independent_zero_audit.py'
      - 'research/verify_zero_google_coverage.py'
      - 'research/finalize_full_google_498.py'
      - 'research/external_google_clinical_adjudications.py'
      - 'research/test_external_clinical_adjudications.py'
      - 'research/enrich_independent_google_places.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ontario-401-fsa-live-ranking-20261121
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install explicit Python source dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile evidence collector, independent audit, and classification
        run: |
          python -m compileall -q research/verify_zero_google_coverage.py research/reconcile_independent_zero_audit.py research/enrich_independent_google_places.py research/finalize_full_google_498.py
      - name: Verify independent Google clinical evidence and zero-cap safeguards
        run: |
          python -m unittest research.test_independent_zero_source research.test_independent_rank_dominance research.test_google_category_evidence research.test_google_bounded_recovery research.test_google_partial_lower_bounds research.test_external_clinical_adjudications -v
