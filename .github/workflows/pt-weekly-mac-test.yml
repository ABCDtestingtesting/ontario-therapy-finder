name: PT local Mac launcher and 60-FSA integration tests
on:
  push:
    paths:
      - 'pt-weekly-mac/**'
      - '.github/workflows/pt-weekly-mac-test.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mac-test:
    strategy:
      matrix:
        os: [macos-15, macos-15-intel]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Package the actual anonymous collector
        run: |
          cd pt-weekly-mac
          test -x Run.command
          bash -n Run.command
          zip -9 "$RUNNER_TEMP/PT-Weekly-Mac.zip" Run.command weekly_keyless.py keyless_probe.py release_gate.py test_keyless.py test_directory_index.py directory_index.py directory_snapshot.csv candidates.csv README.txt
      - name: Extract and test the distributable itself
        run: |
          mkdir "$RUNNER_TEMP/release-test"
          cd "$RUNNER_TEMP/release-test"
          unzip "$RUNNER_TEMP/PT-Weekly-Mac.zip"
          test -x Run.command
          ./Run.command --self-test
          python -m unittest -v test_directory_index.py
          python -m compileall -q .
      - uses: actions/upload-artifact@v4
        with:
          name: PT-Weekly-Mac-${{ matrix.os }}
          path: ${{ runner.temp }}/PT-Weekly-Mac.zip
