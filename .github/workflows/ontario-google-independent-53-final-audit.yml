name: Recalculate Ontario 60 after independent 53-area Google rechecks
on:
  workflow_run:
    workflows:
      - Independently verify all 53 zero-count Ontario Google Maps FSAs
      - Retry only incomplete independent Ontario Google zero-area checks
      - Independently verify clinical categories for nonempty zero-area Google rechecks
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  recertify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ontario-401-fsa-live-ranking-20261121
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore complete historical 498 Ontario census and actual Google source evidence
        run: |
          set -euo pipefail
          mkdir -p baseline
          gh run download 45219618676 -R "$GITHUB_REPOSITORY" -n google-498-category-verified-full-audit -D baseline
          test -s baseline/audited-google-498/ontario_498_google_recovery_audit.csv
      - name: Collect each independently checked zero-area source
        run: |
          set -euo pipefail
          if [ -z "$SOURCE_RUN_ID" ]; then
            SOURCE_RUN_ID="$(gh run list --workflow ontario-google-independent-zero-check.yml --branch ontario-401-fsa-live-ranking-20261121 --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          fi
          test -n "$SOURCE_RUN_ID"
          echo "INDEPENDENT_GOOGLE_RECHECK_SOURCE=$SOURCE_RUN_ID"
          mkdir -p independent-rechecks
          # Always restore first-run source. A retry run contains only missing
          # or incomplete FSAs and must never replace all 53 observations.
          gh run download 45232783797 -R "$GITHUB_REPOSITORY" -p 'independent-zero-*' -D independent-rechecks
          test "$(find independent-rechecks -name '[A-Z][0-9][A-Z].json' -type f | wc -l | tr -d ' ')" -eq 53
          LATEST_RETRY_RUN="$(gh run list -R "$GITHUB_REPOSITORY" --workflow ontario-google-independent-zero-retry.yml --status completed --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          if [ -n "$LATEST_RETRY_RUN" ]; then
            mkdir -p retries
            if gh run download "$LATEST_RETRY_RUN" -R "$GITHUB_REPOSITORY" -p 'independent-zero-retry-*' -D retries; then
              python - <<'PY'
          import json,shutil
          from pathlib import Path
          dest=Path('independent-rechecks')
          for p in Path('retries').glob('**/[A-Z][0-9][A-Z].json'):
              code=p.stem
              original=list(dest.glob('**/'+code+'.json'))
              if len(original)>1:raise RuntimeError('Duplicate historical Google FSA '+code)
              later=json.loads(p.read_text())
              if later.get('fsa')!=code:raise RuntimeError('Retry source identity mismatch')
              if original:
                  first=json.loads(original[0].read_text())
                  if not set(first.get('observations',{})).issubset(
                      set(later.get('observations',{}))):
                      print('REJECT_INCOMPLETE_GOOGLE_RETRY',code,flush=True)
                      continue
                  original_places={x['key'] for x in first.get('local_google_places',[])}
                  newer_places={x['key'] for x in later.get('local_google_places',[])}
                  if not original_places.issubset(newer_places):
                      print('REJECT_GOOGLE_RETRY_LOST_PROVIDERS',code,flush=True)
                      continue
                  shutil.copy2(p,original[0])
              else:
                  target=dest/('independent-zero-retry-'+code)/(code+'.json')
                  target.parent.mkdir(parents=True,exist_ok=True)
                  shutil.copy2(p,target)
              print('ACCEPTED_STRONGER_INDEPENDENT_GOOGLE_RECHECK',code,flush=True)
          PY
            fi
          fi
      - name: Merge individual Google Maps clinical category evidence without discarding any providers
        env:
          CATEGORY_SOURCE_RUN: ${{ github.event.workflow_run.name == 'Independently verify clinical categories for nonempty zero-area Google rechecks' && github.event.workflow_run.id || '' }}
        run: |
          set -euo pipefail
          if [ -z "$CATEGORY_SOURCE_RUN" ]; then
            CATEGORY_SOURCE_RUN="$(gh run list --workflow ontario-google-independent-categories.yml --status completed --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          fi
          if [ -n "$CATEGORY_SOURCE_RUN" ]; then
            mkdir -p categorized-sources
            if gh run download "$CATEGORY_SOURCE_RUN" -R "$GITHUB_REPOSITORY" -p 'independent-categorized-*' -D categorized-sources; then
              python - <<'PY'
          import json
          from pathlib import Path
          for p in Path('categorized-sources').glob('**/[A-Z][0-9][A-Z].json'):
              code=p.stem
              originals=list(Path('independent-rechecks').glob('**/'+code+'.json'))
              if len(originals)!=1:
                  print('SKIP_MISSING_OR_AMBIGUOUS_GOOGLE_ORIGINAL',code,flush=True)
                  continue
              current=json.loads(originals[0].read_text())
              newer=json.loads(p.read_text())
              if newer.get('fsa')!=code or current.get('fsa')!=code:
                  raise RuntimeError('Google source category identity mismatch')
              ids={x['key'] for x in current.get('local_google_places',[])}
              updates={x['key']:x for x in newer.get('local_google_places',[])}
              if not set(updates).issubset(ids):
                  raise RuntimeError('Unknown categories without geographic source confirmation')
              count=0
              for element in current.get('local_google_places',[]):
                  seen=updates.get(element['key'])
                  if seen:
                      for field in ('google_business_category','google_category_checked_at',
                                    'google_category_evidence_url','google_category_error'):
                          if seen.get(field):
                              element[field]=seen[field]
                              count+=1
              # The certification algorithm reconstructs unique Google
              # businesses from observation tiles, NOT from local_google_places.
              # Propagate the verified categories into each underlying tile.
              # Retain the original URL, coordinates, and full raw result.
              for tile in current.get('observations',{}).values():
                  for place in tile.get('places',[]):
                      seen=updates.get(place.get('key'))
                      if seen:
                          for field in ('google_business_category','google_category_checked_at',
                                        'google_category_evidence_url','google_category_error'):
                              if seen.get(field):
                                  place[field]=seen[field]
              current['category_enrichment_report']=newer.get('category_enrichment_report',{})
              originals[0].write_text(json.dumps(current,indent=2))
              print('INDEPENDENT_SOURCE_GOOGLE_CATEGORIES_MERGED',code,count,flush=True)
          PY
            fi
          fi
      - name: Re-evaluate all 498 and certify only genuinely resolved source uncertainty
        run: |
          test "$(find independent-rechecks -name '[A-Z][0-9][A-Z].json' -type f | wc -l | tr -d ' ')" -eq 53
          python -m compileall -q research/reconcile_independent_zero_audit.py
          python -m research.reconcile_independent_zero_audit --baseline baseline/audited-google-498/ontario_498_google_recovery_audit.csv --checkpoints independent-rechecks --out independently-reviewed-ontario-498
      - name: Preserve complete evidence, all 53 crosscheck statuses, revised provisional 60 and uncertainty
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ontario-498-independently-rechecked-53-zero-fsas
          retention-days: 30
          if-no-files-found: error
          path: independently-reviewed-ontario-498/
