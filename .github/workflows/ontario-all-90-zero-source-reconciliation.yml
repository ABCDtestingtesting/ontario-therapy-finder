name: Reconcile 90 actual Google FSA source searches and certify only resolved Ontario top 60
on:
  push:
    paths:
      - '.github/workflows/ontario-all-90-zero-source-reconciliation.yml'
  workflow_run:
    workflows:
      - Recover final 30 current zero-bound Ontario Google FSA source grids
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ontario-401-fsa-live-ranking-20261121
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore strict full-498 baseline and three disjoint source-check batches
        run: |
          set -euo pipefail
          mkdir -p initial-498 recovered-90 first-plan second-plan third-plan
          gh run download 45424716313 -R "$GITHUB_REPOSITORY" -n ontario-498-independently-confirmed-original-google-clinical-offices -D initial-498
          for a in 1 2 3; do
            case "$a" in
              1) id=45421150683; kind='priority-ontario-google-source-*'; name=top30-incomplete-google-verified-sources; dest=first-plan;;
              2) id=45422309089; kind='next30-priority-ontario-google-source-*'; name=next30-incomplete-google-verified-sources; dest=second-plan;;
              3) id=45422718475; kind='last30-priority-ontario-google-source-*'; name=last30-incomplete-google-verified-sources; dest=third-plan;;
            esac
            gh run download "$id" -R "$GITHUB_REPOSITORY" -n "$name" -D "$dest"
            gh run download "$id" -R "$GITHUB_REPOSITORY" -p "$kind" -D recovered-90
          done
          test -s initial-498/Ontario_498_With_Independently_Corroborated_Clinic_Evidence.csv
      - name: Verify 90 distinct planned FSA locations and every recoverable source identity
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          plans=[]
          for label in ('first-plan','second-plan','third-plan'):
              plan=json.loads((Path(label)/'plan.json').read_text())
              assert plan['candidate_fsa_count']==30,(label,plan)
              assert len(plan['fsas'])==30 and len(set(plan['fsas']))==30
              plans.extend(plan['fsas'])
          if len(plans)!=90 or len(set(plans))!=90:
              raise RuntimeError('Google 90-FSA follow-up contains duplicate or missing search plans')
          sources={}
          for path in Path('recovered-90').glob('**/[A-Z][0-9][A-Z].json'):
              if path.stem not in plans or path.stem in sources:
                  raise RuntimeError('Unexpected or duplicated Google FSA checkpoint '+path.stem)
              doc=json.loads(path.read_text())
              if doc.get('fsa')!=path.stem:
                  raise RuntimeError('Recovered Google checkpoint identity mismatch')
              sources[path.stem]={'sha256':hashlib.sha256(path.read_bytes()).hexdigest(),
                'status':doc.get('status'),'unique_observed_local_places':doc.get('unique_observed_local_places'),
                'completed_coverage_tiles':doc.get('completed_coverage_tiles'),
                'total_coverage_tiles':doc.get('total_coverage_tiles')}
          out=Path('source-90-index')
          out.mkdir()
          report={'planned_fsa_count':90,'checkpoint_records':len(sources),
            'unattempted_or_missing_checkpoint_codes':sorted(set(plans)-set(sources)),
            'source_checkpoints':sources,
            'note':'Missing source checkpoint is uncertainty; never zero existing therapists'}
          (out/'Ontario_Google_90_Source_Integrity_Report.json').write_text(json.dumps(report,indent=2))
          print('GOOGLE_90_SOURCE_INTEGRITY',json.dumps({k:v for k,v in report.items() if k!='source_checkpoints'}),flush=True)
          if not sources:
              raise RuntimeError('All recovered 90 Google sources absent')
          PY
      - name: Install clinical search source parser and regression-test all incomplete-source safety rules
        run: |
          python -m pip install -r requirements.txt
          python -m compileall -q research/reconcile_priority_google_rechecks.py
          python -m unittest research.test_reconcile_priority_google_rechecks research.test_native_full_rank -v
      - name: Recompute clinically verified Google source lower bounds across all 498 Ontario FSAs
        run: |
          python -m research.reconcile_priority_google_rechecks --audit initial-498/Ontario_498_With_Independently_Corroborated_Clinic_Evidence.csv --checkpoints recovered-90 --out current-ontario-498
      - name: Block any unverified Ontario top-60 publication
        run: |
          python - <<'PY'
          import csv,json
          from pathlib import Path
          out=Path('current-ontario-498')
          r=json.loads((out/'Ontario_Google_Source_Recheck_Report.json').read_text())
          with (out/'Ontario_498_With_New_Google_Source_Rechecks.csv').open() as f:
              rows=list(csv.DictReader(f))
          assert len(rows)==498 and len({x['fsa'] for x in rows})==498
          assert r['fsa_total']==498 and r['recovered_fsa_checkpoints']<=90
          assert not r['all_real_therapists_enumerated']
          assert (out/'Ontario_60_Certified_Within_Observed_Google_Model.csv').is_file()==r['observed_google_source_model_60_verified']
          print('ONTARIO_498_GOOGLE_90_FINAL_SOURCE_CHECK',json.dumps({k:v for k,v in r.items() if k!='incomplete_recheck_details'}),flush=True)
          PY
      - name: Save verified lower bounds, full 498 records, 90 source coverage and unresolved rank contenders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ontario-498-after-90-fsa-google-priority-research
          retention-days: 90
          if-no-files-found: warn
          path: |
            current-ontario-498/
            source-90-index/
