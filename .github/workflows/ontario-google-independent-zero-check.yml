name: Independently verify all 53 zero-count Ontario Google Maps FSAs
on:
  push:
    branches: [ontario-401-fsa-live-ranking-20261121]
    paths: ['.github/workflows/ontario-google-independent-zero-check.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        fsa: ['L9E', 'L7C', 'K7L', 'N7M', 'L9W', 'N4N', 'L9L', 'P4N', 'L0B', 'L0M', 'N2Z', 'N0B', 'K8A', 'K7G', 'P3L', 'K0A', 'P3P', 'N0E', 'P3E', 'L0A', 'N0L', 'N0J', 'P9A', 'K0C', 'K0K', 'K7V', 'K0B', 'N0G', 'P8N', 'K0G', 'N0H', 'K0L', 'K0H', 'P7A', 'P0N', 'P0C', 'K0J', 'P0G', 'P0P', 'P7G', 'P7L', 'P0J', 'P0H', 'P0R', 'P0Y', 'P0K', 'P0M', 'P0S', 'P0W', 'P0X', 'P0T', 'P0L', 'P0V']
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: '1'
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ontario-401-fsa-live-ranking-20261121
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Load exact previously certified 498-FSA Google audit
        run: |
          set -euo pipefail
          mkdir -p first-pass
          gh run download 45219618676 -n google-498-category-verified-full-audit -D first-pass
          test -s first-pass/audited-google-498/ontario_498_google_recovery_audit.csv
          python - <<'PY'
          import csv
          with open('first-pass/audited-google-498/ontario_498_google_recovery_audit.csv',newline='') as f:
              rows=list(csv.DictReader(f))
          assert len(rows)==498 and len({r['fsa'] for r in rows})==498
          zeros=[r for r in rows if int(r['google_therapy_locations_used_in_score'])==0
                 and r['excluded_last_90_days'].lower()!='true'
                 and r['completed_source_feed'].lower()=='true']
          assert len(zeros)>=53, 'Unexpected base source population'
          code='${{ matrix.fsa }}'
          assert len([r for r in zeros if r['fsa']==code])==1
          print('ZERO_COUNT_GOOGLE_SOURCE_VALIDATED',code,flush=True)
          PY
      - name: Install independent source collection and source tests
        run: |
          python -m pip install -r requirements.txt
          python -m compileall -q research/verify_zero_google_coverage.py
          python -m unittest research.test_google_checkbox_state research.test_google_bounded_recovery -v
          python -m playwright install --with-deps firefox
      - name: Independently verify local businesses under three Google categories
        timeout-minutes: 46
        run: |
          python -m research.verify_zero_google_coverage --fsa "${{ matrix.fsa }}" --baseline first-pass/audited-google-498/ontario_498_google_recovery_audit.csv --out "independent-zero/${{ matrix.fsa }}/${{ matrix.fsa }}.json" --seconds 2500
      - name: Preserve observed businesses, map-centre evidence and all incomplete searches
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-zero-${{ matrix.fsa }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            independent-zero/${{ matrix.fsa }}/${{ matrix.fsa }}.json
            independent-zero/${{ matrix.fsa }}/evidence/
