name: Limited live Google Maps access observation
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/google-access-observation.yml'
permissions:
  contents: read
jobs:
  observe:
    runs-on: macos-15
    timeout-minutes: 28
    env:
      THERAPY_DATA_HOME: ${{ github.workspace }}/google_observation_data
      CI: 'true'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser and dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install firefox
      - name: Observe twelve real consecutive Google Maps results
        timeout-minutes: 23
        run: python -m ci.probe_google_restrictions
      - name: Preserve evidence of access restrictions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: limited-google-access-observation
          retention-days: 7
          if-no-files-found: warn
          path: |
            google_observation_data/ci_google_access_observation/report.json
            google_observation_data/ci_google_access_observation/query_*/search_evidence.json
