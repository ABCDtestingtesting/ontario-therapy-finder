name: Recalculate Ontario outside Hamilton official-FSA clinical density from actual Google places
on:
  push:
    branches: [ontario-401-fsa-live-ranking-20261121]
    paths:
      - '.github/workflows/ontario-official-fsa-geographic-density.yml'
      - 'research/official_fsa_geographic_business_ratio.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  official-fsa-geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ontario-401-fsa-live-ranking-20261121
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore official Statistics Canada FSA boundary and population source archives and original geolocated Google evidence
        run: |
          set -euo pipefail
          mkdir -p official census fsa-shape original
          gh run download 45398047285 -R "$GITHUB_REPOSITORY" -n official-2021-fsa-census-data-probe -D official
          gh run download 45317051215 -R "$GITHUB_REPOSITORY" -n ontario-498-original-google-clinical-business-evidence -D original
          echo 'ff65fc06b0d3435d6588592c225e0f90c41a34156269dac0c596c8f63045eaac  official/fsa-population.zip' | sha256sum --check
          echo 'e581e76ca39122aebccde7653d7cb16037b3efccb7abbc4537125dc8326202b5  official/fsa-boundaries.zip' | sha256sum --check
          unzip -q official/fsa-population.zip -d census
          unzip -q official/fsa-boundaries.zip -d fsa-shape
          test -s fsa-shape/lfsa000a21a_e/lfsa000a21a_e.shp
          test -s census/98100019.csv
          test -s original/Ontario_498_All_Google_Businesses_With_Uncertain_Categories.json
      - name: Install light geospatial parsing and audit source code
        run: |
          python -m pip install 'shapely>=2,<3' 'pyproj>=3.5,<4' 'pyshp>=2.3,<4'
          python -m compileall -q research/official_fsa_geographic_business_ratio.py
      - name: Assign every unique Google business to a real FSA polygon and compare entire FSA census population
        run: |
          python -m research.official_fsa_geographic_business_ratio --boundaries fsa-shape/lfsa000a21a_e/lfsa000a21a_e.shp --census census/98100019.csv --centres research/ontario_all_populated_fsa_2021.json --observed original/Ontario_498_All_Google_Businesses_With_Uncertain_Categories.json --out official-ontario-area-audit
      - name: Verify 498-FSA reproducible geometry counts and refuse exact therapist-ranking claims
        run: |
          python - <<'PY'
          import json,csv
          from pathlib import Path
          p=Path('official-ontario-area-audit')
          d=json.loads((p/'Ontario_Official_FSA_Place_Coverage_Report.json').read_text())
          assert d['eligible_ontario_fsas_outside_hamilton']==498
          assert d['ontario_official_2021_fsa_polygons']==520
          assert d['google_original_geolocated_fsa_observations']==26730
          assert d['google_original_unique_businesses']==14686
          assert d['unique_google_title_clinical_businesses']==2273
          assert not d['certified_60_lowest_registered_therapist_to_population_fsas']
          for name in ('Ontario_498_Official_FSA_Population_Google_Business_Audit.csv',
                       'Ontario_60_Geographically_Screened_Observed_Place_Candidates_NOT_CERTIFIED.csv',
                       'Ontario_60_Observed_Clinical_Lower_Bounds_NOT_CERTIFIED.csv'):
              with (p/name).open(newline='') as f:
                  rows=list(csv.DictReader(f))
              assert len(rows)==(498 if name.startswith('Ontario_498_') else 60),name
          print('STATCAN_OFFICIAL_ON_FSA_GEOGRAPHIC_AUDIT_VERIFIED',d,flush=True)
          PY
      - name: Preserve real area-population ratios, full uncertainty audit and separately labeled provisional leads
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verified-ontario-498-official-fsa-place-density-audit
          retention-days: 30
          if-no-files-found: warn
          path: official-ontario-area-audit/
