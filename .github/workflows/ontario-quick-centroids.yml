name: Ontario shortlist verified FSA coordinates
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ontario-quick-centroids.yml'
permissions:
  contents: read
jobs:
  get-coordinates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      THERAPY_DATA_HOME: ${{ github.workspace }}/fsa_geo_data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Official Ontario FSA centroid JSON
        run: python -m ci.print_candidate_centroids
